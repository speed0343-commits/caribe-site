<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카리브무역 | 브레이크 디스크 카탈로그</title>
  <meta name="description" content="카리브무역 수입차 브레이크 디스크 · 카오스 가공 카탈로그 (A4 인쇄·PDF용)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="catalog.css" />
</head>
<body>
  <!-- 화면에서만 보이는 도구 막대 (인쇄·PDF에는 안 나옴) -->
  <div class="cat-bar">
    <b class="cat-bar-home">카리브무역 카탈로그</b>
    <span class="cat-bar-info" id="catInfo">카탈로그를 만드는 중…</span>
    <span class="cat-bar-save" id="edSave" aria-live="polite"></span>
    <button type="button" class="cat-bar-btn ghost" id="edToggle">✎ 수정하기</button>
    <button type="button" class="cat-bar-btn" id="edPdf">PDF 만들기</button>
  </div>
  <!-- 수정 모드 보조 막대 -->
  <div class="ed-bar" id="edBar" hidden>
    <span>글자를 눌러 바로 고치세요. 고친 곳은 노란색, 넘치는 쪽은 빨간 테두리로 보입니다. 줄바꿈: Enter</span>
    <button type="button" id="edRevertOne" disabled>이 칸 원래대로</button>
    <button type="button" id="edRevertAll">모두 원래대로</button>
    <button type="button" id="edExport">수정 내용 파일 받기</button>
    <label class="ed-import">수정 내용 불러오기<input type="file" id="edImport" accept=".json,application/json" hidden /></label>
  </div>

  <main id="book" class="book" aria-label="카리브무역 카탈로그"></main>

  <!-- 홈페이지와 별개로 운영. 상품·차종·연구 데이터 파일만 저장소의 것을 읽어 옵니다 -->
  <script src="../catalog-data.js"></script>
  <script src="../data.js"></script>
  <script src="../core.js"></script>
  <script src="../data/research-papers.js"></script>
  <script src="../data/literature-measurements.js"></script>
  <script src="../data/test-plan.js"></script>
  <script src="photos/photos.js"></script>
  <script src="editor.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
